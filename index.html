<!DOCTYPE html>
<html lang="es">
    <head>
        <!--
        <meta name="veiwport" content="width=device-width, initial-scale=1.0">
    -->
        <title>DangerDrive Website</title>
        <link rel="stylesheet" href="styles.css"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <script>
            var modal = document.getElementById("modal");

            // Get the button that opens the modal
            var btn = document.getElementById("badge");

            // Get the <span> element that closes the modal
            var span = document.getElementsByClassName("close")[0];

            // When the user clicks on the button, open the modal
            btn.onclick = function() {
            modal.style.display = "block";
            }

            // When the user clicks on <span> (x), close the modal
            span.onclick = function() {
            modal.style.display = "none";
            }

            // When the user clicks anywhere outside of the modal, close it
            window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
            } 
        </script>
    </head>
    <!--
    <header class="header">
        Here's some cool text!
    </header>
    -->
    <body>
        <div class="modal" id="modal">
            this is a pop-up modal
        </div>
        <div class="hero">
            <div class="badge" id="badge">
                ★  HUMAN MADE ★
            </div>
            <div class="title m1">
                DangerDrive.com
            </div>
            <div class="subtitle m1">
                Quick links to all hosted services on DangerDrive.
            </div>
        </div>
            <div class="grid">
                    <button class="colorful-button jellyfin" href="https://jelly.dangerdrive.com">
                        <div class="wrapper">
                        <img src="icons/jellyfin.svg" alt="Jellyfin Icon" class="logo">
                        <div class="label">Jellyfin</div>
                    </button>

                    <button class="colorful-button cloudstorage">
                        <div class="wrapper">
                        <img src="icons/nextcloud.svg" alt="Nextcloud Icon" class="logo">
                        <div class="label">Cloud Storage</div>
                    </button>
                </div>
                <div class="grid">
                    <button class="colorful-button audiomuse">
                        <div class="wrapper">
                        <img src="icons/audiomuse.svg" alt="Audio Muse Icon" class="logo">
                        <div class="label">Audio Muse</div>
                    </button>

                    <button class="colorful-button nas">
                        <div class="wrapper">
                        <img src="icons/truenas.svg" alt="NAS Icon" class="logo">
                        <div class="label">NAS Management</div>
                    </div>
                </button>
            </div>
    </body>
</html>
