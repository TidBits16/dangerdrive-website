<!DOCTYPE html>
<html lang="es">
    <head>
        <!--
        <meta name="veiwport" content="width=device-width, initial-scale=1.0">
    -->
        <title>DangerDrive Website</title>
        <link rel="stylesheet" href="styles.css"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    </head>
    <!--
    <header class="header">
        Here's some cool text!
    </header>
    -->
    <body>
        <div class="hero">
            <div class="badge">
                ★  100% HUMAN MADE ★
            </div>
            <div class="title m1">
                DangerDrive.com
            </div>
            <div class="subtitle m1">
                Quick links to all hosted services on DangerDrive.
            </div>
        </div>
            <div class="grid">
                    <button class="colorful-button jellyfin" href="https://jelly.dangerdrive.com">
                        <div class="wrapper">
                        <img src="icons/jellyfin.svg" alt="Jellyfin Icon" class="logo">
                        <div class="label">Jellyfin</div>
                    </button>

                    <button class="colorful-button cloudstorage">
                        <div class="wrapper">
                        <img src="icons/nextcloud.svg" alt="Nextcloud Icon" class="logo">
                        <div class="label">Cloud Storage</div>
                    </button>
                </div>
                <div class="grid">
                    <button class="colorful-button audiomuse">
                        <div class="wrapper">
                        <img src="icons/audiomuse.svg" alt="Audio Muse Icon" class="logo">
                        <div class="label">Audio Muse</div>
                    </button>

                    <button class="colorful-button nas">
                        <div class="wrapper">
                        <img src="icons/truenas.svg" alt="NAS Icon" class="logo">
                        <div class="label">NAS Management</div>
                    </div>
                </button>
            </div>
    </body>
</html>
